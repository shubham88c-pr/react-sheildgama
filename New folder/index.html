        /* ---------- Global Styles ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            background: #f3f4f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px;
            min-height: 100vh;
            gap: 40px;
        }

        /* ---------- Form Container ---------- */
        .form-container {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffffff;
            padding: 25px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            z-index: 999;
            width: 350px;
            animation: popup 0.35s ease forwards;
        }

        @keyframes popup {
            from {
                transform: translate(-50%, -55%) scale(0.9);
                opacity: 0;
            }

            to {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        .form-container h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #111827;
        }

        .form-container form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-container label {
            font-size: 14px;
            font-weight: 500;
            color: #555;
        }

        .form-container input[type="text"] {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-container input[type="text"]:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }

        .tag-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tag-checkbox span {
            font-size: 14px;
        }

        .submit-btn {
            margin-top: 10px;
            padding: 10px;
            border: none;
            background: #4f46e5;
            color: #fff;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #312e81;
        }

        .closeform {
            margin-top: 10px;
            width: 100%;
            background: #ef4444;
            color: #fff5f5;
            border: none;
            border-radius: 10px;
            padding: 10px;
            text-transform: capitalize;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
        }

        .closeform:hover {
            background: #dc2626;
        }

        /* ---------- Note Container ---------- */
        .note-container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }

        /* ---------- Left Icons ---------- */
        .left-icons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .left-icons button {
            background: #4f46e5;
            border: none;
            color: #fff;
            font-size: 18px;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .left-icons button:hover {
            background: #4338ca;
            transform: scale(1.1);
        }

        /* ---------- Stack (Cards Container) ---------- */
        .stack {
            position: relative;
            width: 320px;
            height: 230px;
        }

        /* ---------- Card Styles ---------- */
        .card {
            position: absolute;
            top: 0;
            left: 0;
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        /* Stacking effect using nth-child */
        .card:nth-child(1) {
            z-index: 3;
            transform: translateY(0);
        }

        .card:nth-child(2) {
            z-index: 2;
            transform: translateY(15px) scale(0.98);
            opacity: 0.9;
        }

        .card:nth-child(3) {
            z-index: 1;
            transform: translateY(30px) scale(0.96);
            opacity: 0.7;
        }
        .card:nth-child(4) {
            z-index: 1;
            transform: translateY(20px) scale(0.94);
            opacity: 0.7;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15);
        }

        /* Avatar */
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            display: block;
            border: 2px solid #4f46e5;
        }

        /* Name */
        .card h2 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #111;
        }

        /* Info Section */
        .info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 6px;
            color: #555;
        }

        /* Buttons */
        .buttons {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .buttons button {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            border: none;
            transition: 0.3s;
        }

        button.call {
            background: #111827;
            color: white;
        }

        button.call:hover {
            background: #15803d;
        }

        button.msg {
            background: #e5e7eb;
            color: #111;
        }

        button.msg:hover {
            background: #0369a1;
            color: #fff;
        }

        /* ---------- Right Color Dots ---------- */
        .right-colors {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 40px;
        }

        .dot {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.2s;
        }

        .dot:hover {
            transform: scale(1.1);
        }

        .black {
            background: #000;
        }

        .purple {
            background: #9333ea;
        }

        .orange {
            background: #f97316;
        }

        .teal {
            background: #14b8a6;
        }
    </style>
</head>
